[workspace]
resolver = "2"
members = ["crates/agentbus-core", "crates/agentbus-stdio", "crates/agentbus-cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reedom/agentbus"
homepage = "https://github.com/reedom/agentbus"
keywords = ["mcp", "ai", "agents", "message-bus"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
